name: Build and push images

on:
  push:
    branches: [main]
    # Release tags X.Y.Z (no "v" prefix, see git.md): the version is shown in the Informazioni page and added as image tag
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: true

env:
  # Push only from main or from a release tag, never for pull requests
  PUSH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag') }}

jobs:
  api:
    name: API image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Release tag X.Y.Z -> version X.Y.Z. The tag name goes through an environment variable, never inline in the script
      - name: Version from tag
        id: version
        if: github.ref_type == 'tag'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$REF_NAME" =~ ^([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Tag must be in the X.Y.Z format" >&2
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build and test
        run: |
          dotnet restore SagreEventi.sln --locked-mode
          dotnet build SagreEventi.sln -c Release --no-restore
          dotnet test SagreEventi.sln -c Release --no-build

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image (push on main)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/SagreEventi.Web.Server/Dockerfile
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sagreeventi-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sagreeventi-api:${{ github.sha }}
            ${{ steps.version.outputs.version != '' && format('{0}/sagreeventi-api:{1}', secrets.DOCKERHUB_USERNAME, steps.version.outputs.version) || '' }}
          no-cache: true

  web:
    name: Angular image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Release tag X.Y.Z -> version X.Y.Z. The tag name goes through an environment variable, never inline in the script
      - name: Version from tag
        id: version
        if: github.ref_type == 'tag'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$REF_NAME" =~ ^([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Tag must be in the X.Y.Z format" >&2
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # A failing test stops the job before the image is built or pushed
      - name: Test
        working-directory: src/SagreEventi.Web
        run: |
          npm ci
          npm test

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The Dockerfile already runs npm ci and the production build
      - name: Build image (push on main)
        uses: docker/build-push-action@v7
        with:
          context: src/SagreEventi.Web
          push: ${{ env.PUSH == 'true' }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sagreeventi-web:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sagreeventi-web:${{ github.sha }}
            ${{ steps.version.outputs.version != '' && format('{0}/sagreeventi-web:{1}', secrets.DOCKERHUB_USERNAME, steps.version.outputs.version) || '' }}
          no-cache: true
